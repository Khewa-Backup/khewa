services:
    _defaults:
        public: true

    ##############
    # Your Module

    smartargetmessagebar.module:
        class: smartargetmessagebar
        factory: ['Module', 'getInstanceByName']
        arguments:
            - 'smartargetmessagebar'

    smartargetmessagebar.context:
        class: Context
        factory: ['Context', 'getContext']

    #####################
    # PrestaShop Account
    smartargetmessagebar.ps_accounts_installer:
        class: 'PrestaShop\PsAccountsInstaller\Installer\Installer'
        arguments:
            - '5.0'

    smartargetmessagebar.ps_accounts_facade:
        class: 'PrestaShop\PsAccountsInstaller\Installer\Facade\PsAccounts'
        arguments:
            - '@smartargetmessagebar.ps_accounts_installer'

    #####################
    # PrestaShop Billing

    smartargetmessagebar.ps_billings_context_wrapper:
        class: 'PrestaShopCorp\Billing\Wrappers\BillingContextWrapper'
        arguments:
            - '@smartargetmessagebar.ps_accounts_facade'
            - '@smartargetmessagebar.context'
            - false # if true, enables the sandbox mode, if false or empty, disables it

    smartargetmessagebar.ps_billings_facade:
        class: 'PrestaShopCorp\Billing\Presenter\BillingPresenter'
        public: true
        arguments:
            - '@smartargetmessagebar.ps_billings_context_wrapper'
            - '@smartargetmessagebar.module'

    # Remove this if you do not need BillingService
    smartargetmessagebar.ps_billings_service:
        class: 'PrestaShopCorp\Billing\Services\BillingService'
        public: true
        arguments:
            - '@smartargetmessagebar.ps_billings_context_wrapper'
            - '@smartargetmessagebar.module'
