# khewacorechanges — Symfony service overrides.
#
# PrestaShop (1.7.8 and 9.x) loads modules/<name>/config/services.yml for every
# installed+active module (LoadServicesFromModulesPass), AFTER the core
# definitions, so re-declaring a core service id here replaces it.
#
# CORE_CHANGES.md #3 — Orders grid "New customer" performance fix.
# The core class is `final`, so we swap the whole service class.
# `file:` makes Symfony require the class file itself, so no autoloader
# entry is needed for the module's src/ folder.
# PrestaShop 9.2: same service id and arguments as 1.7, and the core class code is unchanged
# from 1.7 (checked against the official 9.2.0 file), so the module's class still fits.
services:
    prestashop.core.grid.query_builder.order:
        class: 'KhewaCoreChanges\Grid\Query\KhewaOrderQueryBuilder'
        file: '%kernel.project_dir%/modules/khewacorechanges/src/Grid/Query/KhewaOrderQueryBuilder.php'
        arguments:
            - '@doctrine.dbal.default_connection'
            - '%database_prefix%'
            - '@prestashop.core.query.doctrine_search_criteria_applicator'
            - '@=service("prestashop.adapter.legacy.context").getContext().language.id'
            - "@=service(\"prestashop.adapter.shop.context\").getContextListShopID(parameter('multishop.settings.share_orders'))"

    # CORE_CHANGES.md #11 "Also found" — customized customer-service mail handlers.
    # PrestaShop 9.2: the handlers moved to Core\Domain\CustomerService\CommandHandler, their service ids
    # changed, and core wires them to the Symfony Messenger command bus through the #[AsCommandHandler]
    # attribute (which adds the `messenger.message_handler` tag) instead of tactician tags.
    # Here: same ids and arguments as 9.2 core, the class (and its file) point to the module copies
    # (9.2 core code + Khewa's change), and the tag is set explicitly because the module class is
    # loaded through `file:`, not the autoloader, so the attribute can't be read at build time.
    prestashop.core.domain.customer_service.command_handler.add_order_customer_message:
        class: 'KhewaCoreChanges\CustomerService\CommandHandler\AddOrderCustomerMessageHandler'
        file: '%kernel.project_dir%/modules/khewacorechanges/src/CustomerService/CommandHandler/AddOrderCustomerMessageHandler.php'
        public: true
        arguments:
            - '@translator'
            - '@validator'
            - '@=service("prestashop.adapter.legacy.context").getContext().shop.id'
            - '@=service("prestashop.adapter.legacy.context").getContext().language.id'
            - '@=service("prestashop.adapter.legacy.context").getContext().employee.id'
        tags:
            - { name: messenger.message_handler, method: handle, handles: 'PrestaShop\PrestaShop\Core\Domain\CustomerMessage\Command\AddOrderCustomerMessageCommand' }

    prestashop.core.domain.customer_service.command_handler.reply_to_customer_thread_handler:
        class: 'KhewaCoreChanges\CustomerService\CommandHandler\ReplyToCustomerThreadHandler'
        file: '%kernel.project_dir%/modules/khewacorechanges/src/CustomerService/CommandHandler/ReplyToCustomerThreadHandler.php'
        public: true
        arguments:
            - '@=service("prestashop.adapter.legacy.context").getContext()'
        tags:
            - { name: messenger.message_handler, method: handle, handles: 'PrestaShop\PrestaShop\Core\Domain\CustomerService\Command\ReplyToCustomerThreadCommand' }
