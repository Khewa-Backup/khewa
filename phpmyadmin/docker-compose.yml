services:
  mysql:
    image: mysql:8.0
    container_name: khewa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: khewa
    ports:
      - "3307:3306"
    volumes:
      - khewa-mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=512M

  phpmyadmin:
    image: phpmyadmin:5
    container_name: khewa-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 512M
    ports:
      - "8081:80"

volumes:
  khewa-mysql-data:
